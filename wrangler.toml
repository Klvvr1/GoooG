# Cloudflare Pages & D1 / KV Database Configuration for GoooG
name = "gooog"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

# 1. Cloudflare D1 SQL Database Binding
# To create in Cloudflare CLI:
#   npx wrangler d1 create gooog-db
# Then copy database_name and database_id below:
[[d1_databases]]
binding = "DB"
database_name = "gooog-db"
database_id = "your-d1-database-id-here"
migrations_dir = "migrations"

# 2. Cloudflare KV Namespace Binding (Key-Value Storage)
# To create in Cloudflare CLI:
#   npx wrangler kv namespace create GOOOG_KV
# Then copy binding and id below:
[[kv_namespaces]]
binding = "KV"
id = "your-kv-namespace-id-here"
